trajectory_offboard_node:
  ros__parameters:
    use_sim_time: false

    offboard:
      enabled: true
      auto_start: true
      arm_on_start: true
      prearm_setpoints: 10
      setpoint_rate_hz: 100.0
      heartbeat_rate_hz: 5.0
      publish_rate_hz: 0.0
      auto_start_retry_period_s: 1.0
      takeoff_before_trajectory: true
      use_start_transition: true
      start_transition_duration_s: 4.0
      takeoff_position_tolerance: 0.25
      takeoff_velocity_tolerance: 0.5

    setpoint:
      level: position
      velocity_feedforward: true
      acceleration_feedforward: true
      yaw_rate_feedforward: true

    px4:
      offboard_control_mode_topic: /fmu/in/offboard_control_mode
      trajectory_setpoint_topic: /fmu/in/trajectory_setpoint
      vehicle_command_topic: /fmu/in/vehicle_command
      vehicle_odometry_topic: /fmu/out/vehicle_odometry
      target_system: 1
      target_component: 1
      source_system: 1
      source_component: 1

    visualization:
      path_topic: reference/trajectory
      current_pose_topic: reference/current_pose
      vehicle_pose_topic: vehicle/current_pose
      frame_id: map
      ned_to_enu: true
      preview_points: 240
      path_publish_period_s: 0.5

    trajName: figure8_horizontal
    trajectory_type: 1
    omega_value: 0.5
    path_preview_cycles: 10.0
    trajectory_yaw_lock: false
    trajectory_yaw_fixed: 0.0
    origin_x: 0.0
    origin_y: 0.0

    figure8_horizontal_Ax: 2.0
    figure8_horizontal_Ay: 2.0
    figure8_horizontal_Hc: 3.0
    figure8_horizontal_theta0: 0.0

    figure8_vertical_Ay: 2.0
    figure8_vertical_Az: 2.0
    figure8_vertical_Hc: 3.0
    figure8_vertical_theta0: -0.7853981633974483

    helix_flip_Ay: 2.0
    helix_flip_Az: 2.0
    helix_flip_Hc: 3.0
    helix_flip_Vx: 0.30
    helix_flip_theta0: 0.0

    helix_flip_y_Ax: 2.0
    helix_flip_y_Az: 2.0
    helix_flip_y_Hc: 3.0
    helix_flip_y_Vy: 0.30
    helix_flip_y_theta0: 0.0

    flip_loop_sine_Ay: 2.0
    flip_loop_sine_Az: 2.0
    flip_loop_sine_Hc: 3.0
    flip_loop_sine_Vx: 0.0
    flip_loop_sine_theta0: 0.0

    fast_circle_Ax: 3.0
    fast_circle_Ay: 3.0
    fast_circle_Hc: 3.0
    fast_circle_theta0: 0.0
