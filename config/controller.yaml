trajectory_offboard_node:
  ros__parameters:
    use_sim_time: false

    offboard:
      enabled: true
      auto_start: true
      arm_on_start: true
      prearm_setpoints: 10
      setpoint_rate_hz: 250.0
      heartbeat_rate_hz: 5.0
      publish_rate_hz: 0.0
      auto_start_retry_period_s: 1.0
      takeoff_before_trajectory: true
      use_start_transition: true
      start_transition_duration_s: 4.0
      takeoff_position_tolerance: 0.25
      takeoff_velocity_tolerance: 0.5

    # PX4 callbacks cache their newest sample. The reference/translational
    # layer uses a fixed timer; fresh angular-velocity samples trigger the
    # wrench calculation up to inner_loop_rate_hz.
    outer_loop_rate_hz: 100.0
    inner_loop_rate_hz: 250.0

    setpoint:
      level: position
      velocity_feedforward: true
      acceleration_feedforward: true

    # 6 keeps the PX4 position-controller path. Types 0-5 publish a ROS wrench.
    controller_type: 6
    ctrl_mode: 1
    gravity: 9.81
    mass: 0.75
    inertia_x: 0.0025
    inertia_y: 0.0021
    inertia_z: 0.0043
    # Complete Geometric INDI: main.tex Eq. (55), (60), and (61).
    indi_acceleration_enabled: true
    drag_dx: 0.0
    drag_dy: 0.0
    drag_dz: 0.0
    Kp_x: 30.0
    Kp_y: 30.0
    Kp_z: 20.0
    Kv_x: 10.0
    Kv_y: 10.0
    Kv_z: 10.0
    KR_r: 150.0
    KR_p: 150.0
    KR_y: 80.0
    KOmega_r: 50.0
    KOmega_p: 50.0
    KOmega_y: 3.0
    # main.m Geometric INDI gains, independent of the other controllers.
    indi_Kp_x: 10.0
    indi_Kp_y: 10.0
    indi_Kp_z: 10.0
    indi_Kv_x: 6.0
    indi_Kv_y: 6.0
    indi_Kv_z: 6.0
    indi_Ktheta_r: 150.0
    indi_Ktheta_p: 150.0
    indi_Ktheta_y: 3.0
    indi_Komega_r: 20.0
    indi_Komega_p: 20.0
    indi_Komega_y: 8.0
    # Common yaw-torque output filter for the direct external-wrench path.
    yaw_torque_cutoff_hz: 1.0
    # Same convention as mavros_controllers:
    # normalizedthrust_constant = mass / total_max_thrust.
    normalizedthrust_constant: 0.020
    normalizedthrust_offset: 0.0
    normalizedtorque_constant_r: 0.319957823650
    normalizedtorque_constant_p: 0.319957823650
    normalizedtorque_constant_y: 1.962568474088

    px4:
      offboard_control_mode_topic: /fmu/in/offboard_control_mode
      trajectory_setpoint_topic: /fmu/in/trajectory_setpoint
      vehicle_thrust_setpoint_topic: /fmu/in/vehicle_thrust_setpoint
      vehicle_torque_setpoint_topic: /fmu/in/vehicle_torque_setpoint
      vehicle_command_topic: /fmu/in/vehicle_command
      acceleration_indi_feedback_topic: /fmu/out/vehicle_acceleration_indi_feedback
      allocation_value_topic: /fmu/out/allocation_value
      vehicle_attitude_topic: /fmu/out/vehicle_attitude
      vehicle_angular_velocity_topic: /fmu/out/vehicle_angular_velocity
      target_system: 1
      target_component: 1
      source_system: 1
      source_component: 1

    visualization:
      path_topic: reference/trajectory
      current_pose_topic: reference/current_pose
      vehicle_pose_topic: vehicle/current_pose
      vehicle_path_topic: vehicle/path
      frame_id: map
      ned_to_enu: true
      preview_points: 240
      path_publish_period_s: 0.1
      vehicle_path_max_points: 30
      vehicle_path_min_distance_m: 0.05

    trajName: figure8_horizontal
    trajectory_type: 1
    omega_value: 0.5
    path_preview_cycles: 10.0
    trajectory_yaw_lock: false
    trajectory_yaw_fixed: 0.0
    origin_x: 0.0
    origin_y: 0.0

    figure8_horizontal_Ax: 3.0
    figure8_horizontal_Ay: 3.0
    figure8_horizontal_Hc: 6.0
    figure8_horizontal_theta0: 0.0

    figure8_vertical_Ay: 3.0
    figure8_vertical_Az: 3.0
    figure8_vertical_Hc: 6.0
    figure8_vertical_theta0: -0.7853981633974483

    helix_flip_Ay: 3.0
    helix_flip_Az: 3.0
    helix_flip_Hc: 6.0
    helix_flip_Vx: 0.30
    helix_flip_theta0: 0.0

    helix_flip_y_Ax: 3.0
    helix_flip_y_Az: 3.0
    helix_flip_y_Hc: 6.0
    helix_flip_y_Vy: 0.30
    helix_flip_y_theta0: 0.0

    flip_loop_sine_Ay: 3.0
    flip_loop_sine_Az: 3.0
    flip_loop_sine_Hc: 6.0
    flip_loop_sine_Vx: 0.0
    flip_loop_sine_theta0: 0.0

    fast_circle_Ax: 3.0
    fast_circle_Ay: 3.0
    fast_circle_Hc: 6.0
    fast_circle_theta0: 0.0
